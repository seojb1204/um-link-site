<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UM LINK Flight Journey</title>
<meta name="description" content="인천(ICN)에서 로스앤젤레스(LAX)까지 항공기 1대가 태평양을 건너는 18초 모션 그래픽">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 단독 재생 페이지: 영상 한 편을 보여 주는 어두운 상영 화면(단일 테마) */
:root{--bg:#070d22;--ink:#eef2fb;--muted:#a9b4d4;--line:#26335f;--accent:#4cc3dc;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1320px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header a{color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);padding:6px 12px;border-radius:9px}
header a:hover{color:var(--ink);border-color:var(--accent)}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:600;text-wrap:balance}
h1 small{display:block;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.scenes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.scenes li{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0}
.scenes button{all:unset;cursor:pointer;display:grid;gap:4px}
.scenes button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.scenes .t{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--accent)}
.scenes b{font-size:15px}
.scenes span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.scenes{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.scenes{grid-template-columns:1fr}}
.foot{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>UM LINK</small>Flight Journey · ICN → LAX</h1>
    <nav style="display:flex;gap:8px;flex-wrap:wrap"><a href="index.html">소개 사이트</a><a href="app.html">작동형 앱</a></nav>
  </header>
  <div id="player"></div>
  <ol class="scenes" aria-label="장면 구성 · 누르면 해당 장면으로 이동">
    <li><button data-seek="0"><span class="t">0:00–0:03</span><b>출발지 소개</b><span>인천국제공항 마커와 공항 이름</span></button></li>
    <li><button data-seek="3"><span class="t">0:03–0:06</span><b>항공기 출발</b><span>지나온 경로가 청록 실선으로 그려짐</span></button></li>
    <li><button data-seek="6"><span class="t">0:06–0:12</span><b>태평양 횡단</b><span>항공기를 따라 지도가 확대·이동</span></button></li>
    <li><button data-seek="12"><span class="t">0:12–0:15</span><b>로스앤젤레스 접근</b><span>남은 점선이 줄어들고 도착지 표시</span></button></li>
    <li><button data-seek="15"><span class="t">0:15–0:18</span><b>도착 · 여정 완료</b><span>FLIGHT JOURNEY COMPLETED</span></button></li>
  </ol>
  <p class="foot">공항 좌표(ICN 37.4602°N 126.4407°E, LAX 33.9416°N 118.4085°W)를 잇는 대권 항로를 바탕으로 한 시각화 시뮬레이션이에요. 실제 운항 항적이 아니에요. 스페이스바로 재생·일시정지, 화살표로 1초씩 이동할 수 있어요.</p>
</div>
<script src="flight-journey.js"></script>
<script>
(function () {
  var p = UMFlightJourney.mount(document.getElementById('player'), { autoplay: true });
  document.querySelectorAll('[data-seek]').forEach(function (b) {
    b.addEventListener('click', function () { p.seek(+b.dataset.seek); p.play(); p.el.focus({ preventScroll: true }); });
  });
})();
</script>
</body>
</html>
