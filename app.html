<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UM LINK 시연 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 앱 설치(PWA) — 홈 화면에 추가하면 주소창 없이 전체화면으로 열려요 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UM LINK">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 시연 상단 바 + 1~2개의 앱 패널(승무원 태블릿 | 보호자 모바일), 같은 저장소를 공유 */
:root{
  --bg:#edf1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#14203f; --muted:#5a6684; --line:#d4dbe6;
  --navy:#1f2a5c; --navy-2:#2d3a73; --navy-ink:#ffffff; --navy-muted:#b6c0e0;
  --accent:#1b7594; --accent-ink:#ffffff; --accent-soft:#e0eff5;
  --ok:#2a7a4a; --ok-soft:#e0f2e6; --warn:#985a10; --warn-soft:#fbeedb; --bad:#b03535; --bad-soft:#f9e2e2;
  --sea:#dfe9f2; --land:#c9d6e3; --route:#1b7594; --fx-remain:#8590aa; --plane:#1f2a5c; --grid:rgba(31,42,92,.10); --tile-filter:none;
  --shadow:0 1px 2px rgba(20,32,63,.06),0 6px 20px rgba(20,32,63,.06);
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1223; --surface:#151d35; --surface-2:#1a2340; --ink:#e4e9f5; --muted:#97a2c2; --line:#2a3556;
  --navy:#0f1730; --navy-2:#24305c; --navy-ink:#eef1fa; --navy-muted:#97a3cc;
  --accent:#4cb0d1; --accent-ink:#06202b; --accent-soft:#14364a;
  --ok:#6cc893; --ok-soft:#163927; --warn:#e6a95b; --warn-soft:#3b2b14; --bad:#ef8b8b; --bad-soft:#432026;
  --sea:#14223d; --land:#22314f; --route:#4cb0d1; --fx-remain:#8792b8; --plane:#f1f4fb; --grid:rgba(200,212,245,.10); --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1223; --surface:#151d35; --surface-2:#1a2340; --ink:#e4e9f5; --muted:#97a2c2; --line:#2a3556;
  --navy:#0f1730; --navy-2:#24305c; --navy-ink:#eef1fa; --navy-muted:#97a3cc;
  --accent:#4cb0d1; --accent-ink:#06202b; --accent-soft:#14364a;
  --ok:#6cc893; --ok-soft:#163927; --warn:#e6a95b; --warn-soft:#3b2b14; --bad:#ef8b8b; --bad-soft:#432026;
  --sea:#14223d; --land:#22314f; --route:#4cb0d1; --fx-remain:#8792b8; --plane:#f1f4fb; --grid:rgba(200,212,245,.10); --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 시연 바 */
.demo-bar{background:var(--navy);color:var(--navy-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.demo-bar .home{color:var(--navy-muted);text-decoration:none;font-size:13px;border:1px solid var(--navy-2);padding:5px 10px;border-radius:8px}
.demo-bar .home:hover{color:var(--navy-ink)}
.demo-bar .brand{font-weight:700;letter-spacing:.04em;font-size:16px}
.demo-bar .brand small{font-weight:500;color:var(--navy-muted);letter-spacing:0;margin-left:6px;font-size:12px}
.demo-tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--navy-2);color:var(--navy-muted)}
.demo-bar .sp{flex:1}
.seg{display:inline-flex;background:var(--navy-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--navy-muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--navy-ink);color:var(--navy)}
.demo-bar .btn-reset{background:transparent;border:1px solid var(--navy-muted);color:var(--navy-ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.demo-bar .btn-reset.confirm{background:var(--bad);border-color:var(--bad);color:#fff}

.stage{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-items:start}
.stage.split{grid-template-columns:1fr}
@media (min-width:1080px){.stage.split{grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr)}}
.stage.single{max-width:1180px;margin:0 auto}
.pane{container-type:inline-size;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:clip;box-shadow:var(--shadow)}
.pane-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px}
.pane-bar .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 상단 연결 상태 표시 — 토스트는 사라지므로 항상 보이는 표시를 둡니다 */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(255,255,255,.10);color:var(--navy-muted)}
.conn i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.conn.c-live{background:var(--ok-soft);color:var(--ok)}
.conn.c-connecting{background:var(--warn-soft);color:var(--warn)}
.conn.c-error{background:rgba(255,120,120,.18);color:#ffb4b4}
@media (max-width:720px){.conn{font-size:11px;padding:3px 8px}}

.role-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.r-guardian{background:var(--accent)} .r-crew{background:var(--navy-2)} .r-admin{background:var(--warn)} .r-ground{background:var(--ok)}

/* ===== 인수 코드 (지상직원 업무 추가 없이 최종 인계를 확인하는 장치) ===== */
.pc-code{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:.18em;
  text-align:center;padding:18px 10px;border-radius:14px;background:var(--surface-2);
  border:1px dashed var(--accent);color:var(--accent);word-break:break-all}
.pc-code.used{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.pc-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pc-in{font-family:var(--font-mono);font-size:26px;letter-spacing:.16em;text-align:center}
.pc-done{display:grid;gap:10px;place-items:center;text-align:center;padding:26px 16px}
.pc-done .mark{width:62px;height:62px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
  display:grid;place-items:center;font-size:30px;font-weight:700}

/* 공통 컴포넌트 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;text-decoration:none;min-height:42px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-navy{background:var(--navy);color:var(--navy-ink)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-line.accent{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--accent);padding:6px 8px;min-height:0}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:6px 11px;min-height:32px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled],.btn.is-off{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.sim{background:transparent;border-style:dashed;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.soft{background:var(--surface-2)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.note.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.note .i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;line-height:13px;text-align:center;font-weight:700;margin-top:2px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px}
textarea.input{min-height:72px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.divider{border:0;border-top:1px dashed var(--line);margin:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* 로그인 */
.login{padding:28px 20px;display:grid;gap:18px;max-width:560px;margin:0 auto}
.login h2{font-size:24px}
.acct{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.acct:hover{border-color:var(--accent)}
.acct .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.acct .t{flex:1;min-width:0}
.acct .t b{display:block}
.acct .t span{font-size:13px;color:var(--muted)}

/* 보호자 앱 */
.g-app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:640px;background:var(--bg)}
.g-top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.g-top .logo{font-weight:700;color:var(--navy);letter-spacing:.02em}
:root[data-theme="dark"] .g-top .logo{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-top .logo{color:var(--ink)}}
.g-top .kid{flex:1;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
.g-main{flex:1;padding:16px;display:grid;gap:16px;align-content:start}
.g-tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.g-tabs button{border:0;background:transparent;padding:9px 2px 10px;font-size:12px;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:3px;position:relative}
.g-tabs button svg{width:20px;height:20px}
.g-tabs button.on{color:var(--accent);font-weight:700}
.g-tabs .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.sub-top{display:flex;align-items:center;gap:8px;padding:12px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sub-top h2{font-size:18px;flex:1}
.back{border:0;background:transparent;cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px}
.back svg{width:22px;height:22px}

.hero{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:18px;display:grid;gap:14px}
.hero .eyebrow{color:var(--navy-muted)}
.hero h1{font-size:24px}
.hero .age{font-size:15px;font-weight:500;color:var(--navy-muted)}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.strip{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--navy-2);border-radius:12px;padding:12px 14px}
.strip .code{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1}
.strip .city{font-size:12px;color:var(--navy-muted)}
.strip .end{text-align:right}
.strip .mid{display:grid;justify-items:center;gap:9px;font-size:11px;color:var(--navy-muted);min-width:0}
/* 편명과 비행시간이 좁은 화면에서 한 글자씩 세로로 쪼개지지 않게 합니다 */
.strip .mid > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@container (max-width:460px){.strip .mid .dur{display:none}}
.strip .line{width:100%;height:0;border-top:1.5px dashed var(--navy-muted);position:relative}
.strip .line svg{position:absolute;left:50%;top:-9px;width:18px;height:18px;transform:translateX(-50%) rotate(90deg);fill:var(--navy-ink)}
.now{background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px}
.now-label{font-size:12px;color:var(--muted);font-weight:600}
.now-title{font-size:19px;font-weight:700}
.now-sub{font-size:14px;color:var(--muted)}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--navy-muted)}
.meta-row b{color:var(--navy-ink)}

.tl{display:grid;gap:0;padding-left:4px}
.tl-item{display:grid;grid-template-columns:22px 1fr auto;gap:12px;position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:10px;top:22px;bottom:0;border-left:2px solid var(--line)}
.tl-item:last-child::before{display:none}
.tl-item.done::before{border-color:var(--accent)}
.tl-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl-item.done .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-item.done .tl-dot svg{width:12px;height:12px;stroke:var(--accent-ink)}
.tl-item.cur .tl-dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-item.cur .tl-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl-t{font-weight:600;font-size:15px}
.tl-d{font-size:13px;color:var(--muted)}
.tl-item.todo .tl-t{color:var(--muted);font-weight:500}
.tl-s{font-size:12px;font-weight:600;padding-top:2px}
.tl-item.done .tl-s{color:var(--ok)} .tl-item.cur .tl-s{color:var(--accent)} .tl-item.todo .tl-s{color:var(--muted)}

.ho{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ho:last-child{border-bottom:0}
.ho .who{font-weight:600;font-size:14px}
.ho .meta{font-size:12px;color:var(--muted);grid-column:1/-1}

.map{width:100%;height:auto;display:block;border-radius:12px;background:var(--sea)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:17px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

.loc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.loc{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-size:13px;color:var(--muted);background:var(--surface)}
.loc.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:600}
.svc{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.svc:last-child{border-bottom:0}
.feed{display:grid;gap:0}
.feed div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.feed div:last-child{border-bottom:0}

.ntabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ntabs button{flex:none}
.noti{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer;width:100%}
.noti.unread{border-color:var(--accent);background:var(--accent-soft)}
.noti .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.noti:not(.unread) .dot{background:transparent}
.noti b{display:block;font-size:14px}
.noti p{font-size:13px;color:var(--muted)}
/* 알림을 누르면 관련 화면으로 이동해요. 어디로 가는지 미리 보여 줍니다. */
.noti-go{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;
  font-weight:600;color:var(--accent)}
.noti:hover .noti-go{text-decoration:underline}
.noti:active{transform:scale(.995)}

/* ===== 위급 알림 =====================================================
   기획서의 '위급 / 일반 2단계'. 위급은 알림 받기를 꺼도 전달되고,
   홈 화면 맨 위에 빨간 카드로 고정됩니다. */
.noti.sev{border-color:var(--bad);background:var(--bad-soft)}
.noti.sev .dot{background:var(--bad)}
.noti.sev .noti-go{color:var(--bad)}
.sev-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--bad);
  background:var(--bad-soft);border:1px solid var(--bad);border-radius:99px;
  padding:1px 7px;margin-bottom:4px}
.alarm{border:2px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);
  padding:16px;display:grid;gap:10px;margin-bottom:4px}
.alarm .hd{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:700;font-size:13px}
.alarm .hd .pulse{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;
  animation:apulse 1.4s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.alarm .hd .pulse{animation:none}}
.alarm b{font-size:17px;color:var(--ink);display:block}
.alarm p{font-size:14px;color:var(--ink);opacity:.85}
.alarm .acts{display:flex;gap:8px;flex-wrap:wrap}
.alarm .acts .btn{min-height:40px}
.noti time{font-size:12px;color:var(--muted)}
.switch{position:relative;width:46px;height:26px;flex:none;border-radius:13px;border:0;background:var(--line);cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}

.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.locked img{filter:blur(2.5px) saturate(.8)}
.thumb .wm{position:absolute;inset:auto 4px 4px auto;font-size:10px;font-weight:700;background:rgba(15,23,48,.72);color:#fff;padding:2px 6px;border-radius:5px}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center}
.thumb .play span{width:30px;height:30px;border-radius:50%;background:rgba(15,23,48,.7);display:grid;place-items:center}
.thumb .play svg{width:12px;height:12px;fill:#fff}
.thumb.sel{outline:3px solid var(--accent);outline-offset:-3px}
.thumb .selno{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.grp-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.viewer-img{position:relative;border-radius:12px;overflow:hidden;background:#000}
.viewer-img img{width:100%;display:block}
.viewer-img.locked img{filter:blur(6px)}
.viewer-img .lockmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:600;padding:20px;background:rgba(10,16,34,.45)}
.kenburns img{animation:kb 8s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-3%,-2%)}}
.slideshow{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:#0b1020}
.slideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.slideshow .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.65))}

.prod{display:grid;gap:10px}
.prod-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.price{font-family:var(--font-mono);font-weight:600;font-size:18px;white-space:nowrap}
.req{display:flex;flex-wrap:wrap;gap:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.steps span{padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.hist{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.hist div{display:flex;gap:10px}
.hist .mono{flex:none}

.cl-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.cl-title{font-weight:700;color:var(--navy);text-align:center;font-size:18px;border:0;background:transparent;width:100%;padding:4px}
:root[data-theme="dark"] .cl-title{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cl-title{color:var(--ink)}}
.cl-canvas{position:relative;width:100%;aspect-ratio:5/4;max-width:100%}
.cl-canvas .cell{position:absolute;border-radius:8px;overflow:hidden;background:var(--line)}
.cl-canvas .cell img{width:100%;height:100%;object-fit:cover;display:block}
.cl-canvas .cell.round{border-radius:50%;border:3px solid var(--surface);box-shadow:var(--shadow)}
.cl-canvas svg{position:absolute;inset:0;width:100%;height:100%}
.cl-foot{text-align:center;font-size:13px;color:var(--muted)}
.style-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.style-opt{border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--surface);font-size:13px}
.style-opt.on{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.sticky-actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}

/* 승무원 앱 */
.crew{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:680px}
.c-side{background:var(--navy);color:var(--navy-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.c-brand{padding:4px 8px 14px}
.c-brand b{font-size:18px;display:block}
.c-brand span{font-size:12px;color:var(--navy-muted)}
.c-nav{display:grid;gap:4px}
.c-nav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--navy-muted);padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
.c-nav button svg{width:18px;height:18px;flex:none}
.c-nav button.on{background:var(--accent);color:#fff;font-weight:700}
.c-net{margin-top:auto;background:var(--navy-2);border-radius:12px;padding:12px;font-size:13px;display:grid;gap:8px}
.c-net .row{gap:8px;flex-wrap:nowrap}
.c-net .lbl2{flex:1}
.c-net .off{color:#ffc58a}
.c-main{min-width:0;background:var(--bg);display:flex;flex-direction:column}
.c-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.c-head h2{font-size:19px;color:var(--navy)}
:root[data-theme="dark"] .c-head h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-head h2{color:var(--ink)}}
.c-body{padding:18px 20px;display:grid;gap:16px;align-content:start}
.c-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.um-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.um-card .nm{font-weight:700;font-size:16px}
.um-pick{display:flex;gap:6px;flex-wrap:wrap}
.um-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.um-pick button.on{border-color:var(--navy);background:var(--navy);color:var(--navy-ink);font-weight:600}
.todo{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.todo:last-child{border-bottom:0}
.todo .box{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;flex:none}
.todo .go{margin-left:auto;color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.grp{display:grid;gap:8px}
.preview-card{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:8px;padding:12px}
.viewfinder{position:relative;aspect-ratio:4/3;border:2px dashed var(--muted);border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;max-width:100%}
.viewfinder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .vf-label{position:absolute;top:10px;left:10px;font-size:12px;background:rgba(15,23,48,.7);color:#fff;padding:3px 8px;border-radius:6px}
.viewfinder .blocked{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:var(--surface-2);color:var(--muted);font-weight:600}
.shutter-row{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid var(--accent);background:var(--surface);cursor:pointer}
.shutter:active{transform:scale(.95)}
.shutter[disabled]{border-color:var(--line);cursor:not-allowed}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;cursor:pointer}
.mode.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:600}
.q{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q img{width:60px;height:60px;border-radius:8px;object-fit:cover;display:block}
.q b{font-size:14px}
.q .st{font-size:12px}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.muted{color:var(--muted)}
.hstep{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.hstep .n{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.hstep.done .n{background:var(--accent);border-color:var(--accent)}
.hstep.done .n svg{width:16px;height:16px;stroke:#fff}
.hstep.cur{border:2px solid var(--accent)}
.hstep.cur .n{border-color:var(--accent)}
.hstep h3{font-size:16px}
.qr{border:2px dashed var(--muted);border-radius:12px;display:grid;place-items:center;aspect-ratio:1;max-width:150px;width:100%;background:var(--surface-2);font-weight:700;color:var(--muted);cursor:pointer;padding:8px;text-align:center}
.qr.got{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.ho-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}

/* 관리자 */
.admin{display:grid;min-height:600px}
.a-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.a-tabs button{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.a-tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.a-body{padding:18px;display:grid;gap:16px;background:var(--bg);align-content:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.perm-y{color:var(--ok);font-weight:700}
.perm-n{color:var(--muted)}


/* Leaflet 1.9.4 핵심 스타일(외부 CSS를 불러올 수 없어 필요한 부분만 인라인) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font-family:var(--font-body);-webkit-tap-highlight-color:transparent;background:var(--sea);outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200;filter:var(--tile-filter)}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-control-attribution{background:rgba(255,255,255,.8);color:#333;font-size:10px;line-height:1.4;padding:0 5px;margin:0}
.leaflet-control-attribution a{color:#0b5f7b;text-decoration:none}

/* 비행 여정 · 항공기 이동 지도 */
.fx-slot{height:clamp(240px,62cqw,320px);border-radius:12px;background:var(--sea)}
.fx-mapbox{position:relative;height:clamp(240px,62cqw,320px);border-radius:12px;overflow:hidden;background:var(--sea);isolation:isolate;border:1px solid var(--line)}
.fx-canvas{position:absolute;inset:0}
.fx-canvas.svg svg{width:100%;height:100%;display:block}
.fx-badge{position:absolute;left:10px;top:10px;z-index:1001;font-size:11px;font-weight:700;background:var(--navy);color:var(--navy-ink);padding:3px 9px;border-radius:99px;pointer-events:none}
.fx-reason{position:absolute;left:10px;top:36px;z-index:1001;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:8px;max-width:calc(100% - 20px);pointer-events:none}
.fx-tools{position:absolute;right:10px;top:10px;z-index:1001;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.fx-tool{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;min-height:28px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fx-tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fx-tool.sq{width:28px;padding:0;font-size:16px;line-height:1}
.fx-legend{position:absolute;left:8px;bottom:8px;z-index:1001;display:flex;gap:4px 10px;flex-wrap:wrap;font-size:11px;color:var(--ink);background:var(--surface);opacity:.92;padding:3px 8px;border-radius:8px;max-width:calc(100% - 110px);pointer-events:none}
.fx-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fx-legend i{display:inline-block;width:16px;height:0;border-top:3px solid var(--route)}
.fx-legend i.l2{border-top:2px dashed var(--fx-remain)}
.fx-legend svg{width:12px;height:12px;fill:var(--plane)}
.fx-flown{stroke:var(--route);fill:none}
.fx-remain{stroke:var(--fx-remain);fill:none}
.fx-plane{width:36px;height:36px;display:grid;place-items:center;will-change:transform}
.fx-plane svg{width:30px;height:30px;fill:var(--plane);stroke:var(--surface);stroke-width:1.1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.fx-ap{position:relative}
.fx-ap .d{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.fx-ap b{position:absolute;top:-4px;font-family:var(--font-mono);font-size:12px;color:var(--ink);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap}
.fx-ap.l b{left:16px}.fx-ap.r b{right:16px}
.fx-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx-ctrl .btn{min-width:0}
.fx-speed{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fx-speed button{border:0;background:var(--surface);padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted);min-height:32px}
.fx-speed button.on{background:var(--navy);color:var(--navy-ink);font-weight:600}
.fx-range{width:100%;accent-color:var(--accent);margin:0}
.demo-fold{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.demo-fold>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px;min-height:32px}
.demo-fold>summary::-webkit-details-marker{display:none}
.demo-fold>summary::before{content:'▸';font-size:11px}
.demo-fold[open]>summary::before{content:'▾'}
.sim-tag{font-size:10px;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
.fx-svg-grid{stroke:var(--grid);stroke-width:1}
.fx-svg-lbl{fill:var(--muted);font-size:9px;font-family:var(--font-mono)}
.fx-svg-dl{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.fx-svg-ap{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.fx-svg-code{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-mono)}
.fx-svg-plane{fill:var(--plane);stroke:var(--surface);stroke-width:1.1}

/* 토스트 */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;width:min(420px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--navy);color:var(--navy-ink);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;animation:tin .2s ease-out}
.toast.err{background:var(--bad);color:#fff}
.toast small{display:block;color:var(--navy-muted);font-size:11px}
.toast.err small{color:#ffe1e1}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

@container (max-width:900px){ .c-cols{grid-template-columns:1fr} }
@container (max-width:620px){
  .crew{grid-template-columns:1fr}
  /* min-width:0 이 없으면 아래 overflow-x:auto 가 무력화되고
     내용이 부모(.pane)를 밀어내 화면 밖으로 잘립니다. */
  .c-side{flex-direction:column;padding:12px;min-width:0}
  .c-brand{padding:0 4px 6px;min-width:0}
  .c-nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;min-width:0;
         scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .c-net{margin-top:6px;min-width:0}
  .c-cols{grid-template-columns:1fr}
}
@container (max-width:460px){
  .ho-grid{grid-template-columns:1fr}
  .c-body{padding:14px}
  .stats{grid-template-columns:1fr 1fr}
  .loc-grid{grid-template-columns:repeat(2,1fr)}
  .stats .stat:nth-child(3):last-child{grid-column:1/-1}
}
</style>

<!-- ============================================================

const NOTI_ROUTE = {
  handoff: { tab:'home',    label:'인계 기록 보기' },
  status:  { tab:'live',    label:'실시간 현황 보기' },
  flight:  { tab:'flight',  label:'비행 여정 보기' },
  media:   { tab:'archive', label:'아카이브 열기' },
  order:   { sub:'shop',    label:'주문 상태 보기' },
  privacy: { sub:'settings',label:'설정 열기' },
};
const TAB_LABEL = { home:'홈 보기', flight:'비행 여정 보기', live:'실시간 현황 보기', noti:'알림 보기', archive:'아카이브 열기' };
const SUB_LABEL = { settings:'설정 열기', shop:'추억 상품 보기', order:'주문 상태 보기', collage:'AI 콜라주 열기', pickup:'인수 코드 보기' };
function notiTarget(n){
  if (n && n.to && (n.to.tab || n.to.sub)) {
    return { tab:n.to.tab, sub:n.to.sub,
      label: n.to.sub ? (SUB_LABEL[n.to.sub] || '자세히 보기') : (TAB_LABEL[n.to.tab] || '자세히 보기') };
  }
  return NOTI_ROUTE[n && n.type] || { tab:'home', label:'홈 보기' };
}

function gNoti(p, u, m, f){
  const flt = p.ui.nf || 'all';

  /* 읽지 않은 위급 알림이 맨 위로 고정됩니다. */
  const list = S.notifications.filter(n => n.guardianId === u.id && (!map[flt] || map[flt].includes(n.type))).slice()
    .sort((a, b) => {
      const pa = (isUrgent(a) && !a.read) ? 1 : 0, pb = (isUrgent(b) && !b.read) ? 1 : 0;
      return pb - pa || b.at.localeCompare(a.at);
    });
  const ft = (k, t) => `<button class="chip ${flt === k ? 'on' : ''}" data-act="nf" data-v="${k}">${t}</button>`;
  return `
  <div class="row between"><h2 style="font-size:20px">알림</h2><button class="btn btn-ghost" data-act="read-all">모두 읽음</button></div>
  <div class="ntabs">${ft('all','전체')}${ft('hs','인계 · 상태')}${ft('flight','항공편')}${ft('media','콘텐츠 · 주문')}</div>
  <div class="stack">${list.length ? list.map(n => `<button class="noti ${n.read ? '' : 'unread'} ${isUrgent(n) ? 'sev' : ''}" data-act="read-one" data-id="${n.id}"><span class="dot"></span><span>${isUrgent(n) ? '<span class="sev-tag">위급</span>' : ''}<b>${esc(n.title)}</b><p>${esc(n.body)}</p><span class="noti-go">${esc(notiTarget(n).label)} →</span></span><time class="mono">${hm(n.at)}</time></button>`).join('') : '<div class="empty">이 분류의 알림이 없어요.</div>'}</div>
  <section class="card row between" style="flex-wrap:nowrap"><div><b>일반 알림 받기</b><div class="small muted">단계 완료 · 상태 리포트 · 항공편 변경. 꺼도 기록은 남아요.</div></div><button class="switch ${u.notify ? 'on' : ''}" data-act="notify-toggle" aria-pressed="${u.notify}" aria-label="일반 알림 받기"></button></section>
  <div class="note"><span class="i">!</span><span><b>위급 알림은 끌 수 없어요.</b> 아이 이상 상황과 인수자 미확인은 설정과 상관없이 항상 전달되고, 홈 화면 맨 위에 표시돼요.</span></div>`;

/* ===== 인수 코드 =====================================================
   보호자가 1회용 코드를 발급해 인수자에게 미리 전달하고,
   도착지에서 인수자가 직접 입력해 최종 인계를 확인합니다.

   설계 원칙 — 지상직원의 업무를 늘리지 않습니다.
   지상직원은 기존처럼 에스코트와 신분 확인만 하고 이 기능에 관여하지
   않아요. 코드를 발급하는 쪽도, 입력하는 쪽도 모두 보호자 가족이에요.
   그래서 이 기능은 지상직원의 신분 확인을 '대체'하지 않고, 보호자가
   지정한 사람이 맞는지를 보호자 본인이 확인하도록 보완합니다.

   이 블록과 pickup-* 액션 2개만 지우면 기능 전체가 제거됩니다.
   ==================================================================== */
const CODE_TTL_MIN = 180;
const pickupCode = umId => (S.pickupCodes || []).filter(c => c.umId === umId).slice(-1)[0] || null;
const codeLive = c => !!(c && !c.usedAt && Date.parse(c.expiresAt) > Date.now());
function genCode(){ let s = ''; for (let i = 0; i < 6; i++) s += '0123456789'[Math.floor(Math.random() * 10)]; return s; }

/* 보호자 화면 — 코드 발급과 전달 */

/* ========== 이벤트 처리 ========== */
const paneOf = el => { const pe = el.closest('[data-pane]'); return pe && panes.find(p => p.id === pe.dataset.pane); };
const A = {
  layout(p, el){ layout = el.dataset.v; if (layout === 'split') { if (!panes[1].session) panes[1].session = { userId:'g1' }; } persistUI(); renderAll(); },
  reset(){ if (!resetArm) { resetArm = true; renderAll(); setTimeout(() => { if (resetArm) { resetArm = false; renderAll(); } }, 4000); return; } resetArm = false; panes.forEach(p => p.ui = {}); commit(s => { const n = seed(); Object.keys(s).forEach(k => delete s[k]); Object.assign(s, n); }); toast('시연 데이터를 처음 상태로 되돌렸어요.'); },
  login(p, el){ p.session = { userId: el.dataset.uid }; p.ui = {}; persistUI(); renderAll(); },
  logout(p){ p.session = null; p.ui = {}; persistUI(); renderAll(); },
  /* 보호자 */
  gtab(p, el){ p.ui.gtab = el.dataset.v; rerender(p); },
  'gtab-go'(p, el){ p.ui.gsub = null; p.ui.gtab = el.dataset.v; rerender(p); },
  gsub(p, el){ (p.ui.stack = p.ui.stack || []).push(p.ui.gsub || null); p.ui.gsub = el.dataset.v; rerender(p); },
  gback(p){ const st = p.ui.stack || []; p.ui.gsub = st.length ? st.pop() : null; if (p.ui.gsub === 'checkout' && p.ui.coOrder) p.ui.gsub = st.length ? st.pop() : null; rerender(p); },

  /* ===== 위급 알림 ===== */
  'a-alarm'(p, el){
    const u = pUser(p); if (!can(u, 'um.write')) return deny(p);
    const m = umOf(el.dataset.id), k = el.dataset.k;
    const body = k === 'pickup'
      ? '도착지에서 인수자 확인이 아직 되지 않았어요. 공항 UM 데스크에 연결해 확인해 주세요.'
      : '예정된 시각에 인계가 이뤄지지 않았어요. 담당 직원이 확인 중이에요.';
    const title = k === 'pickup' ? `${m.name} 인수자 미확인` : `${m.name} 인계 지연`;
    commit(s => alarm(s, m.id, 'handoff', title, body, k === 'pickup' ? { sub:'pickup' } : { tab:'home' }));
    toast(`${m.name} 위급 알림을 보호자에게 보냈어요.`, '', '관리자');
  },
  'alarm-ack'(p, el){
    const n = S.notifications.find(x => x.id === el.dataset.id); if (!n) return;
    commit(s => { const x = s.notifications.find(y => y.id === n.id); if (x) x.read = true; });
    toast('확인 표시했어요. 기록은 알림 목록에 남아요.', '', '보호자 앱');
  },
  'alarm-call'(p, el){
    const n = S.notifications.find(x => x.id === el.dataset.id); if (!n) return;
    const m = umOf(n.umId), f = flightOf(m);
    /* 시제품이라 실제 전화는 걸지 않아요. 연결 대상만 보여 줍니다. */
    toast(`${f.toCity} 공항 UM 데스크로 연결해요. 시제품이라 실제 통화는 되지 않아요.`, '', '보호자 앱');
  },

  /* ===== 인수 코드 (지상직원 업무 추가 없음) ===== */
  'pickup-issue'(p){
    const u = pUser(p), m = umOf(u.umId); if (!can(u, 'pickup.issue', m)) return deny(p);
    const code = genCode();
    commit(s => { s.pickupCodes.push({ id:uid('pc'), umId:m.id, code, issuedBy:u.id,
      issuedAt:nowISO(), expiresAt:addMin(nowISO(), CODE_TTL_MIN), usedAt:null, usedByName:null, verifiedBy:null }); });
    toast(`인수 코드 ${code}를 발급했어요. 인수자에게 전달해 주세요.`, '', '보호자 앱');
  },
  /* 인수자에게 코드 전달 — 폰은 공유 시트, 안 되면 클립보드 복사로 떨어집니다 */
  'pickup-share'(p){
    const u = pUser(p), m = umOf(u.umId); if (!m) return;
    const c = pickupCode(m.id);
    if (!codeLive(c)) return toast('먼저 인수 코드를 발급해 주세요.', 'err', '보호자 앱');
    const f = flightOf(m);
    const text = `[UM LINK] ${m.name} 인수 코드\n\n코드: ${c.code}\n항공편: ${f.no} · ${f.to} ${arrTime(f)} 도착\n유효: ${hm(c.expiresAt)}까지\n\n도착장에서 지상직원에게 이 코드를 보여주세요.`;
    const done = () => toast('인수자에게 전달했어요.', '', '보호자 앱');
    if (navigator.share) {
      navigator.share({ title: 'UM LINK 인수 코드', text }).then(done).catch(() => {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => toast('코드를 복사했어요. 문자나 메신저에 붙여넣어 주세요.', '', '보호자 앱'))
        .catch(() => toast('복사하지 못했어요. 코드를 직접 적어 전달해 주세요.', 'err', '보호자 앱'));
      return;
    }
    toast('이 브라우저에서는 자동 전달이 안 돼요. 코드를 직접 전달해 주세요.', 'err', '보호자 앱');
  },
  'pickup-verify'(p, el){
    const u = pUser(p), m = umOf(el.dataset.id);
    if (!m || !can(u, 'pickup.verify', m)) return deny(p);
    if (m.stage < 8) return toast('아직 도착 인계 전이에요.', 'err', '지상직원 앱');
    if (m.stage >= 9) return toast('이미 인계가 끝났어요.', 'err', '지상직원 앱');
    const inp = root.querySelector('#pc-in-' + p.id + '-' + m.id);
    const typed = ((inp && inp.value) || '').replace(/\D/g, '');
    const c = pickupCode(m.id);
    if (!typed) return toast('코드를 입력해 주세요.', 'err', '지상직원 앱');
    if (!codeLive(c)) return toast('쓸 수 있는 코드가 없어요. 보호자에게 재발급을 요청해 주세요.', 'err', '지상직원 앱');
    if (typed !== c.code) return toast('코드가 맞지 않아요. 인수자에게 다시 확인해 주세요.', 'err', '지상직원 앱');
    commit(s => {
      const x = s.ums.find(y => y.id === m.id), f = s.flights[0], t = nowISO();

  'emp-check'(p){ const m = umOf(p.ui.cum); const h = p.ui.ho[m.id]; const st = S.staff.find(s => s.empNo.toLowerCase() === (h.emp || '').trim().toLowerCase());
    if (!st) { h.staffId = null; toast('등록된 지상직원 사번이 아니에요. 예: L-3307', 'err', '승무원 앱'); } else { h.staffId = st.id; toast(`${st.name} · ${st.org} 확인`, '', '승무원 앱'); } rerender(p); },
  'ground-handoff'(p){

      addEvent(s, x.id, { stage:7, title:'지상직원 인계', detail:`${u.name} → ${st.name}`, by:u.name, at:t });
      x.stage = 8; x.lastStatusAt = t; x.lastStatusText = `지상직원 ${st.name}과 도착장 이동`;
      notify(s, x.id, 'handoff', '디지털 인계 완료', `${u.name} 승무원 → ${st.name} 지상직원 · ${f.to} ${f.arrGate}번 게이트`); });
    toast('지상직원 인계를 기록했어요. 보호자 앱에 표시돼요.', '', '승무원 앱');
  },
  /* 관리자 */
  atab(p, el){ p.ui.atab = el.dataset.v; rerender(p); },
  'a-phase'(p, el){ const u = pUser(p); if (!can(u, 'flight.write')) return deny(p); const ph = el.dataset.v;
    commit(s => { const f = s.flights[0]; const prev = f.phase; f.phase = ph; f.progress = PHASE_SIM[ph][2] || (ph === 'cruise' ? Math.max(f.progress, 10) : 0); if (ph === 'cruise') f.progress = Math.min(Math.max(f.progress, 15), 85);
      if (ph === 'departed' && prev !== 'departed') s.ums.forEach(m => { if (m.stage >= 5) notify(s, m.id, 'flight', '이륙했어요', `${f.no}편이 출발했어요. 도착 예정 ${arrTime(f)}.`); }); }); },
  'a-gate'(p){ const u = pUser(p); if (!can(u, 'flight.write')) return deny(p); const g = (p.ui.agate || '').trim(); const f = S.flights[0];
    if (!g || g === f.gate) return toast('새 게이트 번호를 입력해 주세요.', 'err', '관리자');
    commit(s => { const ff = s.flights[0]; const old = ff.gate; ff.gate = g; s.ums.forEach(m => notify(s, m.id, 'flight', '게이트 변경', `${old}번에서 ${g}번 게이트로 바뀌었어요.${m.stage <= 4 ? ' 아이도 직원과 함께 이동해요.' : ''}`)); });
    p.ui.agate = null; toast('게이트 변경을 보호자에게 알렸어요.', '', '관리자'); },
  'a-final'(p, el){ const u = pUser(p); const m = umOf(el.dataset.id); if (!can(u, 'um.write') || m.stage !== 8) return deny(p);
    const who = ((p.ui.pick || {})[m.id] ?? m.pickup).trim() || m.pickup; const gh = lastHandoff(m.id, 7);
    commit(s => { const x = s.ums.find(y => y.id === m.id), t = nowISO();
      s.handoffs.push({ id:uid('ho'), umId:x.id, stage:8, fromName: gh ? gh.toName : '지상직원', toName: who, toOrg:'보호자 지정 인수자', place:`${s.flights[0].toCity} 공항 도착장`, method:'인증 코드 · 신분증 확인', at:t, status:'confirmed' });
      addEvent(s, x.id, { stage:8, title:'최종 인계', detail:`${who}에게 인계`, by: gh ? gh.toName : '지상직원', at:t });
      x.stage = 9; x.lastStatusAt = t; x.lastStatusText = `${who}에게 최종 인계 완료`;
      notify(s, x.id, 'handoff', '최종 인계 완료', `${who}에게 ${x.name}을(를) 인계했어요. 여정이 끝났어요.`); });
    toast('최종 인계를 기록했어요.', '', '관리자'); },
  'a-pi-done'(p, el){ const u = pUser(p); if (!can(u, 'privacy.process')) return deny(p); const id = el.dataset.id;
    commit(s => { const r = s.privacyRequests.find(x => x.id === id); r.status = 'done'; r.doneAt = nowISO();
      s.media.forEach(x => { if (x.umId === r.umId) { x.deleted = true; x.src = null; x.frames = []; } });
      s.events.forEach(e => { if (e.umId === r.umId) e.memo = ''; });
      const c = s.consents.find(x => x.umId === r.umId); if (c) { ['shoot','ai'].forEach(k => { if (c[k].granted) { c[k].granted = false; c[k].withdrawnAt = nowISO(); } }); c.history.push({ at:nowISO(), text:'개인정보 삭제 요청 처리 · 콘텐츠·메모 삭제, 선택 동의 철회' }); }
      reconcile(s, r.umId);
      notify(s, r.umId, 'privacy', '개인정보 삭제 처리 완료', '콘텐츠와 메모를 삭제하고 선택 동의를 철회했어요. 안전 인계 기록은 보관 기간 후 파기돼요.'); });
    toast('삭제 요청을 처리했어요.', '', '관리자'); },
  'a-reset-consent'(p, el){ const id = el.dataset.id; commit(s => { s.consents = s.consents.filter(c => c.umId !== id); s.orders = s.orders.filter(o => o.umId !== id); }); panes.forEach(q => { if (pUser(q) && pUser(q).umId === id) q.ui = {}; }); toast('도윤 보호자 동의를 초기화했어요.', '', '관리자'); },
  'a-refund'(p, el){ const u = pUser(p); if (!can(u, 'order.read')) return deny(p); const id = el.dataset.id;
    commit(s => { const o = s.orders.find(x => x.id === id); o.payment = 'test_refunded'; setOrder(o, 'refunded', '관리자 테스트 환불'); notify(s, o.umId, 'order', `${s.products.find(x => x.id === o.productId).name} 테스트 환불`, '시제품 테스트 결제가 환불 처리됐어요. 실제 청구는 없었어요.'); }); },
};
const CH = {
  'ob-req'(p, el){ p.ui.ob.req[el.dataset.k] = el.checked; rerender(p); },
  'ob-ret'(p, el){ p.ui.ob.retention = el.value; },
  retention(p, el){ const u = pUser(p); commit(s => { const c = s.consents.find(x => x.umId === u.umId); c.retention = el.value; c.history.push({ at:nowISO(), text:`보관 기간 변경 · ${({ '30':'여정 후 30일', '90':'여정 후 90일', manual:'직접 삭제할 때까지' })[el.value]}` }); }); },
  'co-ack'(p, el){ p.ui.co.ack = el.checked; rerender(p); },
  'cam-notify'(p, el){ p.ui.cam.notify = el.checked; },
  async 'cam-file'(p, el){ const file = el.files && el.files[0]; if (!file) return; const m = umOf(p.ui.cum);
    if (!file.type.startsWith('image/')) return toast('사진 파일만 올릴 수 있어요.', 'err', '승무원 앱');
    try { const raw = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); const src = await downscale(raw);
      p.ui.drafts[m.id].push({ kind:'photo', scene:'upload', src, at:nowISO() }); rerender(p); }
    catch (e) { toast('사진을 읽지 못했어요. 다른 파일로 시도해 주세요.', 'err', '승무원 앱'); } },
  'ho-check'(p, el){ p.ui.ho[p.ui.cum].check[el.dataset.k] = el.checked; rerender(p); },
  'fail-uploads'(p, el){ commit(s => { s.net.failUploads = el.checked; }); },
  'a-delay'(p, el){ const u = pUser(p); if (!can(u, 'flight.write')) return deny(p); const v = +el.value;
    commit(s => { const f = s.flights[0]; f.delayMin = v;
      s.ums.forEach(m => { const es = s.staff.find(x => x.id === m.escortId);
        notify(s, m.id, 'flight', v ? '항공편 지연 안내' : '정시 운항 안내', v ? `출발이 ${v}분 늦어져요.${m.stage <= 4 ? ` 아이는 ${es.name} 직원과 ${f.gate}번 탑승구에서 대기 중이에요.` : ''}` : '항공편이 정시 운항으로 바뀌었어요.');
        notify(s, m.id, 'flight', '도착 예정 시간 갱신', `${arrTime(f)} 도착 예정이에요.`); }); });
    toast('지연 정보를 보호자에게 알렸어요.', '', '관리자'); },
  'a-progress'(p, el){ commit(s => { const f = s.flights[0]; f.progress = +el.value; if (f.progress >= 100) f.phase = 'landed'; else if (['scheduled','boarding','landed'].includes(f.phase) && f.progress > 0) f.phase = f.progress > 90 ? 'descent' : 'cruise'; }); },
  'a-stage'(p, el){ const u = pUser(p); if (!can(u, 'um.write')) return deny(p); const id = el.dataset.id, v = +el.value;
    commit(s => { const x = s.ums.find(y => y.id === id); x.stage = v; addEvent(s, id, { stage: Math.min(v, 8), kind:'admin', title:'관리자 조정', detail:`시연용 단계 지정 · ${v >= 9 ? '여정 완료' : STAGES[v].label}`, by:'관리자' }); if (v === 5 && !x.live.location.includes('좌석')) { x.live.location = '좌석에 있어요'; x.live.since = nowISO(); } }); },
};
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.classList.contains('is-off') && el.dataset.act !== 'open-collage') return;
  const fn = A[el.dataset.act]; if (!fn) return; e.preventDefault();
  fn(paneOf(el) || panes[0], el, e);
});
root.addEventListener('change', e => { const el = e.target.closest('[data-act-change]'); if (!el) return; const fn = CH[el.dataset.actChange]; if (fn) fn(paneOf(el) || panes[0], el, e); });
root.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-fx="slider"]')) { const p = paneOf(e.target); if (p && p.fp) { p.fp.t = Math.max(0, Math.min(1, +e.target.value / 1000)); p.fp.synced = false; fxUpdate(p); } return; } const el = e.target.closest('[data-bind]'); if (!el) return; const p = paneOf(el); if (!p) return; setPath(p.ui, el.dataset.bind, el.value);
  if (el.dataset.bind.endsWith('.memo')) { const pv = el.closest('[data-pane]').querySelector('[data-memo-preview]'); if (pv) pv.textContent = el.value ? `“${el.value}”` : ''; } });

/* 콜라주 합성 */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function composeCollage(cl, f){
  const W = 1000, H = 1000, pad = 50, top = 130, bodyH = 760;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#1f2a5c'; ctx.font = '700 46px "IBM Plex Sans KR", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(cl.title, W/2, 86);
  const imgs = await Promise.all(cl.sel.map(id => loadImg(S.media.find(x => x.id === id).src)));
  const cover = (img, x, y, w, h) => { const k = Math.max(w / img.width, h / img.height); const sw = w / k, sh = h / k; ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h); };
  const bw = W - pad * 2;
  if (cl.style === 'map') {
    const pts = MAPSPOTS.slice(0, imgs.length).map(([x, y]) => [pad + x * bw, top + y * bodyH + 30]);
    ctx.strokeStyle = '#1b7594'; ctx.lineWidth = 5; ctx.setLineDash([14, 12]); ctx.beginPath(); pts.forEach(([x, y], i) => { const cx = x + bw * .09, cy = y + bw * .09; i ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy); }); ctx.stroke(); ctx.setLineDash([]);
    imgs.forEach((img, i) => { const r = bw * .09, [x, y] = pts[i]; ctx.save(); ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, 7); ctx.clip(); cover(img, x, y, r*2, r*2); ctx.restore(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, 7); ctx.stroke(); });
  } else {
    const L = layoutFor(Math.min(imgs.length, 6), cl.variant);
    imgs.slice(0, 6).forEach((img, i) => { const [a, b, w, h] = L[i]; const x = pad + a * bw, y = top + b * bodyH, ww = w * bw, hh = h * bodyH; ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, ww, hh, 16); ctx.clip(); cover(img, x, y, ww, hh); ctx.restore(); });
  }
  ctx.fillStyle = '#5a6684'; ctx.font = '500 26px "IBM Plex Mono", monospace'; ctx.fillText(`${new Date().toISOString().slice(0,10)} · ${f.from} → ${f.to}`, W/2, H - 40);
  return c.toDataURL('image/jpeg', .8);
}
